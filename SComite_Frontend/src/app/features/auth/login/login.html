<div class="login-container">
  <div class="login-card">

    <!-- Cabecera / Banner del Aula -->
    <div class="login-header">
      <div class="brand-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
      </div>
      <h2>Comité de Aula</h2>
      <p>Gestión transparente y organizada para apoderados</p>
    </div>

    <!-- Mensaje de Error Global -->
    @if (errorMensaje()) {
      <div class="alert alert-error">
        {{ errorMensaje() }}
      </div>
    }

    <!-- Acceso SSO con SASI -->
    <div class="sso-panel">
      <p class="sso-text">
        Accede con tus credenciales institucionales a través de SASI.
      </p>
      <button type="button" class="btn-primary" (click)="iniciarSso()" [disabled]="cargando()">
        @if (cargando()) {
          <span class="spinner"></span>
          <span>Redirigiendo...</span>
        } @else {
          <span>Iniciar sesión con SASI</span>
        }
      </button>
    </div>

    <!-- Pie de Tarjeta -->
    <div class="login-footer">
      <p>© 2026 - Sistema de Gestión de Comités de Aula</p>
    </div>

  </div>
</div>
