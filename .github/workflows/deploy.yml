name: Deploy Backend and Frontend to Separate Sites 

on:
  push:
    branches:
      - main

jobs:
  # ==========================================
  # JOB 1: COMPILAR Y DESPLEGAR EL BACKEND (.NET)
  # ==========================================
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publish .NET Backend
      run: dotnet publish ./SComite_Backend/AulaComite -c Release -o ./publish-backend

    - name: FTP Deploy Backend
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_BACKEND_SERVER }}
        username: ${{ secrets.FTP_BACKEND_USERNAME }}
        password: ${{ secrets.FTP_BACKEND_PASSWORD }}
        local-dir: ./publish-backend/
        server-dir: /wwwroot/

  # ==========================================
  # JOB 2: COMPILAR Y DESPLEGAR EL FRONTEND (ANGULAR)
  # ==========================================
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build Angular Frontend
      run: |
        cd SComite_Frontend
        npm ci
        npx ng build --configuration production

    # Se apunta la propiedad 'local-dir' directamente a la carpeta 'browser' 
    # donde vive index.html para que suba solo su contenido a la raíz de wwwroot
    - name: FTP Deploy Frontend
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_FRONTEND_SERVER }}
        username: ${{ secrets.FTP_FRONTEND_USERNAME }}
        password: ${{ secrets.FTP_FRONTEND_PASSWORD }}
        local-dir: ./SComite_Frontend/dist/SComite_Frontend/browser/
        server-dir: /wwwroot/
        dangerous-clean-slate: true # Limpia carpetas antiguas en wwwroot para no dejar carpetas sobrantes
