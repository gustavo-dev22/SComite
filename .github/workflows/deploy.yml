name: Deploy Backend and Frontend to Separate Sites

on:
  push:
    branches:
      - main
  # Disparo manual (Actions > Run workflow) para re-aplicar migraciones o probar
  # la conexion a la BD de produccion sin desplegar codigo.
  workflow_dispatch:

jobs:
  # ==========================================
  # JOB 1: MIGRACIONES DE BASE DE DATOS
  # Aplica las migraciones EF en producción ANTES de desplegar el código,
  # de modo que el esquema de BD siempre esté listo cuando suba el binario.
  # Solo corre si hubo cambios en SComite_Backend. Si el secret
  # PROD_DB_CONNECTION_STRING no está configurado, se omite con un warning.
  # ==========================================
  migrate-database:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Verifica si hubo cambios en la carpeta del backend
    - name: Check for Backend changes
      id: backend-changes
      uses: dorny/paths-filter@v3
      with:
        filters: |
          src:
            - 'SComite_Backend/**'

    - name: Setup .NET
      if: steps.backend-changes.outputs.src == 'true' || github.event_name == 'workflow_dispatch'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install EF Core tools
      if: steps.backend-changes.outputs.src == 'true' || github.event_name == 'workflow_dispatch'
      run: dotnet tool install --global dotnet-ef

    # dotnet ef necesita el restore previo; en el runner limpio no existe obj/project.assets.json
    - name: Restore NuGet packages
      if: steps.backend-changes.outputs.src == 'true' || github.event_name == 'workflow_dispatch'
      run: dotnet restore SComite_Backend/AulaComite/AulaComite.Api/AulaComite.Api.csproj

    - name: Apply EF migrations to production database
      if: steps.backend-changes.outputs.src == 'true' || github.event_name == 'workflow_dispatch'
      env:
        ConnectionStrings__DefaultConnection: ${{ secrets.PROD_DB_CONNECTION_STRING }}
      working-directory: SComite_Backend/AulaComite
      run: |
        if [ -z "$ConnectionStrings__DefaultConnection" ]; then
          echo "::warning::El secret PROD_DB_CONNECTION_STRING no está configurado. Omitiendo migraciones automáticas."
          exit 0
        fi
        dotnet ef database update \
          --project AulaComite.Infrastructure/AulaComite.Infrastructure.csproj \
          --startup-project AulaComite.Api/AulaComite.Api.csproj

  # ==========================================
  # JOB 2: BACKEND (Solo si hay cambios en SComite_Backend)
  # Espera a que las migraciones terminen para no desplegar código nuevo
  # sobre un esquema de BD desactualizado.
  # ==========================================
  deploy-backend:
    needs: migrate-database
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Verifica si hubo cambios en la carpeta del backend
    - name: Check for Backend changes
      id: backend-changes
      uses: dorny/paths-filter@v3
      with:
        filters: |
          src:
            - 'SComite_Backend/**'

    - name: Setup .NET
      if: steps.backend-changes.outputs.src == 'true'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # Apuntamos directamente al archivo .csproj para evitar el Warning
    # Publicación framework-dependent (modo que ya corría en el hosting: runasp
    # tiene el runtime .NET instalado y el web.config usa processPath="dotnet").
    - name: Publish .NET Backend
      if: steps.backend-changes.outputs.src == 'true'
      run: dotnet publish ./SComite_Backend/AulaComite/AulaComite.Api/AulaComite.Api.csproj -c Release -o ./publish-backend

    - name: FTP Deploy Backend
      if: steps.backend-changes.outputs.src == 'true'
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_BACKEND_SERVER }}
        username: ${{ secrets.FTP_BACKEND_USERNAME }}
        password: ${{ secrets.FTP_BACKEND_PASSWORD }}
        local-dir: ./publish-backend/
        server-dir: /wwwroot/

  # ==========================================
  # JOB 2: FRONTEND (Solo si hay cambios en SComite_Frontend)
  # ==========================================
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Verifica si hubo cambios en la carpeta del frontend
    - name: Check for Frontend changes
      id: frontend-changes
      uses: dorny/paths-filter@v3
      with:
        filters: |
          src:
            - 'SComite_Frontend/**'

    - name: Setup Node.js
      if: steps.frontend-changes.outputs.src == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build Angular Frontend
      if: steps.frontend-changes.outputs.src == 'true'
      run: |
        cd SComite_Frontend
        npm ci
        npx ng build --configuration production

    - name: FTP Deploy Frontend
      if: steps.frontend-changes.outputs.src == 'true'
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_FRONTEND_SERVER }}
        username: ${{ secrets.FTP_FRONTEND_USERNAME }}
        password: ${{ secrets.FTP_FRONTEND_PASSWORD }}
        local-dir: ./SComite_Frontend/dist/SComite_Frontend/browser/
        server-dir: /wwwroot/
